{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — GTD Manager</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  </script>
</head>
<body class="login-page">
<main class="login-card">
  <h1>
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="3" width="26" height="26" rx="7" fill="#0e6f66"/>
      <path d="M10 16.5l4.5 4.5L23 11.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    GTD Manager
  </h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <p class="msg msg-error">Invalid username or password.</p>
    {% endif %}
    <label for="id_username">Username</label>
    <input type="text" id="id_username" name="username" autofocus autocomplete="username" required>
    <label for="id_password">Password</label>
    <input type="password" id="id_password" name="password" autocomplete="current-password" required>
    <button type="submit" class="btn-primary">Log in</button>
  </form>
</main>
</body>
</html>
