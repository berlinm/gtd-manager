{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Edit area{% else %}Add area{% endif %} — GTD Manager{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Edit area{% else %}Add area{% endif %}</h1>

<form method="post" class="form-narrow">
  {% csrf_token %}

  <label for="{{ form.title.id_for_label }}">Title</label>
  {{ form.title }}

  <label for="{{ form.description.id_for_label }}">Description <small>(optional)</small></label>
  {{ form.description }}

  <label class="check">
    {{ form.active }} Active
  </label>

  <div class="form-actions">
    <button type="submit" class="btn-primary">Save</button>
    <a href="{% url 'core:area_list' %}" class="btn btn-quiet">Cancel</a>
  </div>
</form>
{% endblock %}
